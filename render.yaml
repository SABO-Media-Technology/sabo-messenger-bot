services:
  - type: web
    name: sabo-messenger-bot
    runtime: node
    region: singapore
    plan: free
    rootDir: messenger-bot
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: VERIFY_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: META_USER_ACCESS_TOKEN
        sync: false
      - key: BRAIN_RAG_ENABLED
        value: "false"
